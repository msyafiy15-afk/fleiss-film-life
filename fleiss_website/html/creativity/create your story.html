<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Story - Fleiß</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Fleiß <span>{Film & Life}</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../cinema/index.html">Cinema & Philosophy</a></li>
        <li><a href="../life/index.html">Life & Reflections</a></li>
        <li><a href="index.html" class="active">Creativity</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <a href="index.html" class="btn btn-secondary">← Back to Creativity</a>
    <h2 style="margin-top: 1rem;">Create Your Story</h2>
    <div class="card" style="cursor: default;">
      <div class="form-group">
        <label for="story-author">Your Name / Alias:</label>
        <input type="text" id="story-author" placeholder="e.g. Alex">
      </div>
      <div class="form-group">
        <label for="story-title">Story Title:</label>
        <input type="text" id="story-title" placeholder="Title of your piece">
      </div>
      <div class="form-group">
        <label for="story-content">Your Story:</label>
        <textarea id="story-content" placeholder="Share your experience or narrative..."></textarea>
      </div>
      <button class="btn" onclick="publishStory()">Publish Story</button>
    </div>
  </main>

  <footer>
    <p>© 2026 Film, Life and Everything In Between {Fleiß}.</p>
  </footer>

  <script src="../../script.js"></script>
</body>
</html>
