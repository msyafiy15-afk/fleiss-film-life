<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Journal - Fleiß</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Fleiß <span>{Film & Life}</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../cinema/index.html">Cinema & Philosophy</a></li>
        <li><a href="index.html" class="active">Life & Reflections</a></li>
        <li><a href="../creativity/index.html">Creativity</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <a href="index.html" class="btn btn-secondary">← Back to Life & Reflections</a>
    <h2 style="margin-top: 1rem;">Film Journal</h2>
    <div class="card" style="cursor: default; margin-bottom: 1.5rem;">
      <h3>Add New Entry</h3>
      <div class="form-group">
        <input type="text" id="journal-title" list="journal-film-titles" placeholder="Film Title or Reflection Topic" autocomplete="off">
        <datalist id="journal-film-titles"></datalist>
      </div>
      <div class="form-group">
        <textarea id="journal-text" placeholder="Write your thoughts and life reflections here..."></textarea>
      </div>
      <button class="btn" onclick="saveJournalEntry()">Save Entry</button>
    </div>

    <h3>Your Recorded Journal Entries</h3>
    <div class="form-group">
      <label for="journal-search">Search your entries by film or reflection</label>
      <input type="search" id="journal-search" oninput="filterJournalEntries()" placeholder="Search film titles or journal text...">
    </div>
    <div id="journal-list"></div>
  </main>

  <footer>
    <p>© 2026 Film, Life and Everything In Between {Fleiß}.</p>
  </footer>

  <script src="../../script.js"></script>
  <script>
    window.onload = loadJournalEntries;
  </script>
</body>
</html>
